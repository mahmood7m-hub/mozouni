name: Weekly AI Update

on:
  workflow_dispatch:

  schedule:
    - cron: '0 8 * * 1'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update AI Page
        run: |
          DATE=$(date +"%Y-%m-%d")

          sed -i 's|<p><strong>آخرین بروزرسانی:</strong>.*|<p><strong>آخرین بروزرسانی:</strong> '"$DATE"'</p>|' AI/ai.html

      - name: Commit Changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          git add AI/ai.html

          git diff --staged --quiet || git commit -m "Weekly AI update"

      - name: Push Changes
        run: |
          git push
